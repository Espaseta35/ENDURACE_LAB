<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#090b0e}
  body{font-family:"IBM Plex Sans",Arial,sans-serif;color:#f4f4f1;position:relative}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,107,44,.42),transparent 52%),radial-gradient(circle at 10% 95%,rgba(255,107,44,.16),transparent 45%),#090b0e}
  .grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 135px)}
  .brand{position:absolute;top:150px;left:90px;font:800 46px "Barlow Condensed";letter-spacing:.06em}
  .brand span{color:#ff6b2c}
  .scene{position:absolute;left:90px;right:90px;top:330px;bottom:430px;display:flex;flex-direction:column;justify-content:center}
  .k{font:700 30px "IBM Plex Sans";letter-spacing:.2em;color:#ff6b2c;margin-bottom:26px}
  h1{font:800 172px/.97 "Barlow Condensed";text-transform:uppercase}
  h1 .o{color:#ff6b2c}
  h1 .ol{color:transparent;-webkit-text-stroke:3px #f4f4f1}
  .big{font:800 300px/.86 "Barlow Condensed";font-variant-numeric:tabular-nums}
  .pace{font:600 46px "IBM Plex Sans";color:#ff6b2c;margin-top:14px}
  .bar{height:10px;background:#2a3036;margin-top:56px;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;background:#ff6b2c}
  .bar b{position:absolute;top:50%;width:54px;height:54px;border-radius:50%;background:#ff6b2c;border:10px solid #090b0e;box-shadow:0 0 0 3px #ff6b2c,0 0 50px rgba(255,107,44,.8);transform:translate(-50%,-50%)}
  .card{border:3px solid #3a4148;background:rgba(16,20,25,.92);padding:44px 50px;margin-top:34px}
  .card.on{border-color:#ff6b2c;background:rgba(32,22,17,.95);box-shadow:0 40px 120px -40px rgba(255,107,44,.6)}
  .card .ck{font:700 28px "IBM Plex Sans";letter-spacing:.18em;color:#ff6b2c}
  .card .cv{font:800 170px/.95 "Barlow Condensed";font-variant-numeric:tabular-nums;margin-top:10px}
  .card .cs{font:500 36px "IBM Plex Sans";color:#a8adb2;margin-top:6px}
  .cta-url{font:800 120px/.95 "Barlow Condensed";color:#ff6b2c;margin-top:40px}
  .pill{display:inline-block;margin-top:56px;padding:26px 40px;background:#ff6b2c;color:#111;font:700 40px "IBM Plex Sans"}
  .note{font:500 40px/1.4 "IBM Plex Sans";color:#d0d3d5;margin-top:36px}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="brand" id="brand">ENDURACE<span>_LAB</span></div>
<div class="scene" id="scene"></div>
<script>
  const FPS = 30, f = +new URLSearchParams(location.search).get("f") || 0, t = f / FPS;
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const p = (a, b) => ease((t - a) / (b - a));               // progreso 0..1 entre a y b
  const ft = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
  const ap = (el, a, dy = 80) => { const k = p(a, a + .45); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; };
  const S = document.getElementById("scene");
  const T10 = 2700, HM = T10 * Math.pow(2.10975, 1.06), MA = T10 * Math.pow(4.2195, 1.06);

  if (t < 2.6) {                                              // 1 · gancho
    S.innerHTML = `<p class="k">TEST RÁPIDO</p><h1><span id="a">¿CUÁNTO</span><br><span id="b">HARÍAS EN</span><br><span id="c" class="o">UN MARATÓN?</span></h1>`;
    ["a", "b", "c"].forEach((id, i) => { const el = document.getElementById(id), k = p(.1 + i * .22, .45 + i * .22); el.style.display = "inline-block"; el.style.opacity = k; el.style.transform = `scale(${1.6 - .6 * k})`; el.style.transformOrigin = "left center"; });
    if (t > 2.2) S.style.opacity = 1 - p(2.2, 2.6);
  } else if (t < 6) {                                         // 2 · tu 10K
    const k = p(2.9, 4.6), v = 3600 - (3600 - T10) * k;
    S.innerHTML = `<p class="k" id="k">SI CORRES UN 10K EN</p><div class="big" id="v">${ft(v)}</div><div class="pace" id="pc">${ft(v / 10)} /km</div><div class="bar" id="bar"><i style="width:${30 + 25 * k}%"></i><b style="left:${30 + 25 * k}%"></b></div>`;
    ap(document.getElementById("k"), 2.6); ap(document.getElementById("v"), 2.7); ap(document.getElementById("pc"), 2.9); ap(document.getElementById("bar"), 3.0, 40);
    if (t > 5.6) S.style.opacity = 1 - p(5.6, 6);
  } else if (t < 10.6) {                                      // 3 · predicciones
    const c1 = p(6.4, 7.6), c2 = p(7.4, 8.8);
    S.innerHTML = `<p class="k" id="k">TU PREDICCIÓN</p>
      <div class="card" id="c1"><div class="ck">MEDIA MARATÓN</div><div class="cv">${ft(HM * (0.6 + 0.4 * c1))}</div><div class="cs">${ft(HM * (0.6 + 0.4 * c1) / 21.0975)} /km</div></div>
      <div class="card on" id="c2"><div class="ck">MARATÓN</div><div class="cv">${ft(MA * (0.6 + 0.4 * c2))}</div><div class="cs">${ft(MA * (0.6 + 0.4 * c2) / 42.195)} /km</div></div>`;
    ap(document.getElementById("k"), 6); ap(document.getElementById("c1"), 6.2, 140); ap(document.getElementById("c2"), 7.2, 140);
    if (t > 10.2) S.style.opacity = 1 - p(10.2, 10.6);
  } else if (t < 12.8) {                                      // 4 · gancho 2
    S.innerHTML = `<h1><span id="a">¿Y TU</span><br><span id="b" class="o">MARCA?</span></h1><p class="note" id="n">Mete tu tiempo de 5K, 10K, media o maratón y mira el resto al instante.</p>`;
    ap(document.getElementById("a"), 10.6); ap(document.getElementById("b"), 10.8); ap(document.getElementById("n"), 11.1);
    if (t > 12.4) S.style.opacity = 1 - p(12.4, 12.8);
  } else {                                                    // 5 · llamada a la acción
    S.innerHTML = `<p class="k" id="k">CALCULADORA GRATIS · SIN REGISTRO</p><h1 id="h"><span class="ol">PRUÉBALO</span><br>AHORA</h1><div class="cta-url" id="u">ENDURACE-LAB.COM</div><div><span class="pill" id="pl">Enlace en la bio ↗</span></div>`;
    ap(document.getElementById("k"), 12.8); ap(document.getElementById("h"), 12.95); ap(document.getElementById("u"), 13.2); ap(document.getElementById("pl"), 13.45, 50);
  }
</script>
</body>
</html>
