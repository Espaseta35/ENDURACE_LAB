<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#090b0e}
  body{font-family:"IBM Plex Sans",Arial,sans-serif;color:#f4f4f1;position:relative}
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,107,44,.42),transparent 52%),radial-gradient(circle at 10% 95%,rgba(255,107,44,.16),transparent 45%),#090b0e}
  .bg,.grid{will-change:transform}
  .grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 135px)}
  .brand{position:absolute;top:150px;left:90px;font:800 46px "Barlow Condensed";letter-spacing:.06em}
  .brand span{color:#ff6b2c}
  .tag{position:absolute;top:158px;right:90px;font:700 26px "IBM Plex Sans";letter-spacing:.18em;color:#a8adb2}
  .prog{position:absolute;top:232px;left:90px;right:90px;height:4px;background:rgba(255,255,255,.12)}
  .prog i{position:absolute;inset:0 auto 0 0;background:#ff6b2c}
  #scene{position:absolute;left:90px;right:90px;top:330px;bottom:430px;display:flex;flex-direction:column;justify-content:center}
  .k{font:700 30px "IBM Plex Sans";letter-spacing:.2em;color:#ff6b2c;margin-bottom:28px}
  .h{font:800 168px/.97 "Barlow Condensed";text-transform:uppercase}
  .h span{display:inline-block;transform-origin:left center}
  .o{color:#ff6b2c}.ol{color:transparent;-webkit-text-stroke:3px #f4f4f1}
  .big{font:800 300px/.86 "Barlow Condensed";font-variant-numeric:tabular-nums;white-space:nowrap}
  .big small{font-size:.42em;color:#ff6b2c;margin-left:10px}
  .unit{font:700 64px "Barlow Condensed";letter-spacing:.08em;color:#ff6b2c;margin-top:14px;text-transform:uppercase}
  .sub{font:500 44px/1.4 "IBM Plex Sans";color:#d0d3d5;margin-top:34px}
  .sub b{color:#f4f4f1}
  .card{border:3px solid #3a4148;background:rgba(16,20,25,.92);padding:40px 48px;margin-top:30px}
  .card.on{border-color:#ff6b2c;background:rgba(32,22,17,.95);box-shadow:0 40px 120px -40px rgba(255,107,44,.6)}
  .card .ck{font:700 28px "IBM Plex Sans";letter-spacing:.18em;color:#ff6b2c}
  .card .cv{font:800 150px/.95 "Barlow Condensed";margin-top:10px;white-space:nowrap}
  .card .cs{font:500 36px "IBM Plex Sans";color:#a8adb2;margin-top:8px}
  .zr{display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center;padding:26px 30px;border:3px solid #2a3036;background:rgba(16,20,25,.9);margin-top:18px}
  .zr.on{border-color:#ff6b2c;background:rgba(32,22,17,.95)}
  .zr .zn{font:600 40px "IBM Plex Sans"}
  .zr .zv{font:800 64px "Barlow Condensed";font-variant-numeric:tabular-nums}
  .zr .zb{grid-column:1/-1;height:12px;background:#1c2127;position:relative}
  .zr .zb i{position:absolute;inset:0 auto 0 0}
  .bars{display:flex;align-items:flex-end;gap:22px;height:620px;margin-top:20px}
  .bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:16px}
  .bars .b i{display:block;width:100%;background:#3a4148}
  .bars .b.on i{background:#ff6b2c;box-shadow:0 0 50px rgba(255,107,44,.6)}
  .bars .b em{font:700 34px "IBM Plex Sans";font-style:normal;color:#a8adb2}
  .bars .b.on em{color:#ff6b2c}
  .bars .b span{font:800 54px "Barlow Condensed";color:#f4f4f1}
  .split{display:flex;height:170px;margin-top:40px;overflow:hidden}
  .split div{display:flex;align-items:center;justify-content:center;font:800 76px "Barlow Condensed";color:#111;white-space:nowrap;overflow:hidden}
  .legend{display:flex;gap:40px;margin-top:26px;font:600 34px "IBM Plex Sans";color:#d0d3d5}
  .legend i{display:inline-block;width:34px;height:22px;margin-right:12px;vertical-align:middle}
  .li{display:flex;gap:30px;align-items:baseline;padding:30px 0;border-bottom:2px solid #2a3036}
  .li b{font:800 92px/.9 "Barlow Condensed";color:#ff6b2c;min-width:90px}
  .li span{font:600 50px/1.25 "IBM Plex Sans"}
  .ph{display:flex;gap:8px;margin-top:60px;position:relative}
  .ph div{height:150px;background:#1c2127;display:flex;align-items:flex-end;padding:0 0 18px 18px;font:700 26px "IBM Plex Sans";letter-spacing:.1em;color:#8d959b;overflow:hidden;white-space:nowrap}
  .ph div.on{background:#3a2216;color:#ff6b2c}
  .ph .mk{position:absolute;top:-30px;bottom:-14px;width:8px;margin-left:-4px;background:#ff6b2c;box-shadow:0 0 30px rgba(255,107,44,.9)}
  .ph .mk:before{content:"HOY";position:absolute;top:-46px;left:50%;transform:translateX(-50%);font:700 30px "IBM Plex Sans";letter-spacing:.14em;color:#ff6b2c}
  svg.ln{width:100%;height:620px;margin-top:20px;overflow:visible}
  .cta-url{font:800 112px/.95 "Barlow Condensed";color:#ff6b2c;margin-top:40px;white-space:nowrap}
  .pill{display:inline-block;margin-top:56px;padding:26px 40px;background:#ff6b2c;color:#111;font:700 40px "IBM Plex Sans"}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="brand">ENDURACE<span>_LAB</span></div>
<div class="tag" id="tag"></div>
<div class="prog"><i id="prog"></i></div>
<div id="scene"></div>
<script>
let TL = null;
const S = document.getElementById("scene");
const cl = x => Math.min(1, Math.max(0, x)), ease = x => 1 - Math.pow(1 - cl(x), 3);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ft = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtN = (v, f) => f === "time" ? ft(v) : f === "dec1" ? v.toLocaleString("es-ES", {minimumFractionDigits: 1, maximumFractionDigits: 1}) : f === "dec2" ? v.toLocaleString("es-ES", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : Math.round(v).toLocaleString("es-ES");
let L = 0;                                                    // tiempo local de la escena
const k = (a, d = .5) => ease((L - a) / d);                     // progreso de una animación que empieza en a
const ap = (a, dy = 70, d = .5) => `opacity:${k(a, d)};transform:translateY(${(1 - k(a, d)) * dy}px)`;
const fit = (txt, max, w = 900, r = .5) => Math.min(max, Math.floor(w / (String(txt).length * r)));

const R = {
  hook: s => `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}<div class="h" style="font-size:${s.size || 168}px">${s.lines.map((l, i) => { const q = k(.1 + i * .22, .35); return `<span class="${l[1] || ""}" style="opacity:${q};transform:scale(${1.55 - .55 * q})">${esc(l[0])}</span>`; }).join("<br>")}</div>${s.sub ? `<p class="sub" style="${ap(.4 + s.lines.length * .22)}">${s.sub}</p>` : ""}`,
  big: s => { const q = k(.35, 1.2), v = s.fmt === "str" ? s.to : fmtN((s.from || 0) + (s.to - (s.from || 0)) * q, s.fmt); const txt = (s.pre || "") + v;
    return `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}<div class="big" style="font-size:${fit(txt + (s.small || ""), s.max || 300)}px;${ap(.15, 90)}">${esc(txt)}${s.small ? `<small>${esc(s.small)}</small>` : ""}</div>${s.unit ? `<p class="unit" style="${ap(.5)}">${esc(s.unit)}</p>` : ""}${s.sub ? `<p class="sub" style="${ap(.8)}">${s.sub}</p>` : ""}`; },
  cards: s => `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}${s.cards.map((c, i) => `<div class="card${c.on ? " on" : ""}" style="${ap(.25 + i * .55, 120)}"><div class="ck">${esc(c.k)}</div><div class="cv" style="font-size:${fit(c.v, 150)}px">${esc(c.v)}</div>${c.s ? `<div class="cs">${esc(c.s)}</div>` : ""}</div>`).join("")}`,
  zones: s => `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}${s.rows.map((z, i) => { const cols = ["#6b737a", "#c9ccce", "#ffb08a", "#ff8a55", "#ff6b2c"]; return `<div class="zr${i === s.hl ? " on" : ""}" style="${ap(.2 + i * .2, 60)}"><span class="zn">${esc(z[0])}</span><span class="zv">${esc(z[1])}</span><span class="zb"><i style="width:${z[2] * k(.4 + i * .2, .8)}%;background:${cols[i]}"></i></span></div>`; }).join("")}`,
  bars: s => { const mx = Math.max(...s.items.map(x => x[1])); return `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}${s.title ? `<div class="h" style="font-size:130px;${ap(.1)}"><span class="o">${esc(s.title)}</span></div>` : ""}<div class="bars">${s.items.map((b, i) => `<div class="b${i === s.hl ? " on" : ""}">${i === s.hl ? `<span style="${ap(1.2, 30)}">${esc(s.hlLabel)}</span>` : ""}<i style="height:${b[1] / mx * 82 * k(.3 + i * .08, .9)}%"></i><em>${esc(b[0])}</em></div>`).join("")}</div>${s.sub ? `<p class="sub" style="${ap(1.4)}">${s.sub}</p>` : ""}`; },
  line: s => { const W = 900, H = 600, n = s.pts.length, lo = Math.min(...s.pts) * .97, hi = Math.max(...s.pts) * 1.02, x = i => i / (n - 1) * W, y = v => H - (v - lo) / (hi - lo) * H, q = k(.3, 2.2), m = Math.max(1, Math.round(q * n));
    const pts = s.pts.slice(0, m).map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "), t0 = s.trend[0], t1 = s.trend[1], tq = k(2.3, .8);
    return `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}<svg class="ln" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="#5a6168" stroke-width="5"/>${s.pts.slice(0, m).map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="9" fill="#ff6b2c"/>`).join("")}<line x1="0" y1="${y(t0)}" x2="${W * tq}" y2="${y(t0 + (t1 - t0) * tq)}" stroke="#f4f4f1" stroke-width="7" stroke-dasharray="22 14"/></svg><div style="display:flex;justify-content:space-between;font:700 34px 'IBM Plex Sans';color:#a8adb2;margin-top:14px"><span>${esc(s.from)}</span><span>${esc(s.to)}</span></div>${s.sub ? `<p class="sub" style="${ap(2.6)}">${s.sub}</p>` : ""}`; },
  split: s => `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}${s.title ? `<div class="h" style="font-size:150px;${ap(.1)}">${s.title}</div>` : ""}<div class="split">${s.parts.map((p, i) => `<div style="width:${p[1] * k(.5 + i * .4, .9)}%;background:${p[2]}">${p[1] >= 15 && k(.9 + i * .4) > .5 ? p[1] + " %" : ""}</div>`).join("")}</div><div class="legend" style="${ap(1.4, 30)}">${s.parts.map(p => `<span><i style="background:${p[2]}"></i>${esc(p[0])}</span>`).join("")}</div>${s.sub ? `<p class="sub" style="${ap(1.8)}">${s.sub}</p>` : ""}`,
  list: s => `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}${s.title ? `<div class="h" style="font-size:${s.size || 120}px;margin-bottom:20px;${ap(.05)}">${s.title}</div>` : ""}${s.items.map((t, i) => `<div class="li" style="${ap((s.at || .5) + i * (s.gap || .7), 50)}"><b>${i + 1}</b><span>${t}</span></div>`).join("")}`,
  phases: s => { const tot = s.ph.reduce((a, p) => a + p[1], 0); return `${s.k ? `<p class="k" style="${ap(0)}">${esc(s.k)}</p>` : ""}<div class="big" style="font-size:${fit(s.big, 300)}px;${ap(.1, 90)}">${esc(s.big)}</div><div class="ph" style="${ap(.6, 40)}">${s.ph.map((p, i) => `<div class="${i === s.on ? "on" : ""}" style="flex:${p[1]}">${esc(p[0])}</div>`).join("")}<span class="mk" style="left:${s.pos * k(1, 1)}%"></span></div>${s.sub ? `<p class="sub" style="${ap(1.6)}">${s.sub}</p>` : ""}`; },
  cta: s => `<p class="k" style="${ap(0)}">${esc(s.k || "GRATIS · SIN REGISTRO")}</p><div class="h" style="${ap(.15)}">${s.title || '<span class="ol">PRUÉBALO</span><br>AHORA'}</div><div class="cta-url" style="font-size:${fit(s.url || "ENDURACE-LAB.COM", 112, 900, .47)}px;${ap(.4)}">${esc(s.url || "ENDURACE-LAB.COM")}</div><div style="${ap(.65, 40)}"><span class="pill">${esc(s.pill || "Enlace en la bio ↗")}</span></div>`
};

window.setTimeline = tl => { TL = tl; document.getElementById("tag").textContent = tl.tag || ""; };
window.renderAt = t => {
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  L = t - sc.start; const D = sc.end - sc.start, last = sc === TL.scenes[TL.scenes.length - 1];
  S.innerHTML = R[sc.type](sc);
  S.style.opacity = last ? 1 : 1 - cl((L - (D - .3)) / .3);
  document.getElementById("prog").style.width = (t / TL.duration * 100) + "%";
};
/* Vista previa en el navegador: engine.html?preview=<archivo timeline>&t=<segundos> */
const q = new URLSearchParams(location.search);
if (q.get("tl")) fetch(q.get("tl")).then(r => r.json()).then(tl => { setTimeline(tl); renderAt(+q.get("t") || 0); });
</script>
</body>
</html>
